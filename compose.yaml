# docker compose up  ->  inflates the database on first run (the entrypoint
# builds it when empty), then serves the UI at http://localhost:8017. No keys,
# no accounts - compositions come from chatting with the /comp skill in a
# Claude Code session, which queries this database via ./docker-db.
#
# The app talks to a real postgres service (pgserver ships no linux/arm64
# wheel, and a proper service is the better container shape anyway). Mounts
# keep the expensive and the authored parts on the host: page caches make
# rebuilds cheap, data/raw receives the CSV exports, data/proprietary is
# where you author synergies/strategies and where transcripts land.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: overwatch
      POSTGRES_PASSWORD: overwatch
      POSTGRES_DB: overwatch
    ports:
      - "5433:5432"        # host-side tools (the /comp skill) via ./docker-db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U overwatch -d overwatch"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    ports:
      - "8017:8017"
    environment:
      DATABASE_URL: postgresql://overwatch:overwatch@db/overwatch
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./.cache-blizzard:/app/.cache-blizzard
      - ./.cache-wiki:/app/.cache-wiki
      - ./.cache-counterpick:/app/.cache-counterpick
      - ./data/raw:/app/data/raw
      - ./data/proprietary:/app/data/proprietary

  # The cron: refreshes the data on a schedule (default: daily). Each run is
  # an orchestrator `update` - entities refreshed in place, a new dated
  # snapshot appended, CSVs re-exported - through the same bind-mounted
  # caches. CODED BUT DISABLED by default (profile "cron"): enable with
  #   docker compose --profile cron up -d
  # Tune with OVERWATCH_DB_UPDATE_INTERVAL (seconds).
  updater:
    profiles: ["cron"]
    build: .
    environment:
      DATABASE_URL: postgresql://overwatch:overwatch@db/overwatch
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./.cache-blizzard:/app/.cache-blizzard
      - ./.cache-wiki:/app/.cache-wiki
      - ./.cache-counterpick:/app/.cache-counterpick
      - ./data/raw:/app/data/raw
      - ./data/proprietary:/app/data/proprietary
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        interval="$${OVERWATCH_DB_UPDATE_INTERVAL:-86400}"
        echo "updater: every $${interval}s (first run after one interval)"
        while sleep "$$interval"; do
          echo "updater: running orchestrator update"
          python -m orchestrator update || echo "updater: update failed;"            " will retry next interval"
        done

volumes:
  pgdata:
