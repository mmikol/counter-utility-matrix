# python orchestrator.py  ->  one container per layer, and a guard:
#
#   db          PostgreSQL
#   data        DATA LAYER: builds the database from the bind-mounted page
#               caches when it is empty or stale, then serves the MCP server at
#               http://localhost:8020/mcp (.mcp.json, server
#               "counter-utility-matrix-docker")
#   inference   INFERENCE ENGINE: http://localhost:8019, reading the strategy
#               files live
#   ui          UI LAYER: the board at http://localhost:8017
#   refresher   the data layer's clock: rates and counters daily at
#               COUNTER_MATRIX_REFRESH_AT (05:00 container time; set TZ), every
#               source weekly, and on start when the caches are a day old
#   sentry      the guard: quarantines a strategy file that will not load or
#               reads like an instruction, flags instruction-like text in the
#               inputs and the database, watches the MCP audit log; its report
#               is what `orchestrator.py status` prints
#
# Every container runs as an unprivileged user on a read-only root filesystem
# with every capability dropped and no new privileges, on one network. Only
# data and refresher open a connection out, to three fixed hosts. Every
# published port binds to 127.0.0.1. No keys, no accounts.
# COUNTER_MATRIX_MCP_TOKEN (in .env) requires a bearer token on the MCP server.
# One image, built once by `data`, shared by every container; each container
# mounts only what it reads, read-only unless it writes there.

name: counter-utility-matrix

x-app: &app
  image: counter-utility-matrix
  # the checkout's owner on a Linux host, so the bind mounts stay writable
  user: "${COUNTER_MATRIX_UID:-1000}:${COUNTER_MATRIX_GID:-1000}"
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  deploy:
    resources:
      limits:
        memory: 1g
        pids: 256
  networks: [stack]
  environment: &env
    DATABASE_URL: postgresql://overwatch:${POSTGRES_PASSWORD:-overwatch}@db/overwatch
    # another playbook: a folder under the repo (empty: inference/strategies)
    COUNTER_MATRIX_STRATEGIES: ${COUNTER_MATRIX_STRATEGIES:-}

networks:
  stack: {}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: overwatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-overwatch}
      POSTGRES_DB: overwatch
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:                  # what the image needs to start as root and drop to postgres
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    networks: [stack]
    ports:
      - "127.0.0.1:5433:5432"        # host-side tools via ./docker-db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U overwatch -d overwatch"]
      interval: 2s
      timeout: 3s
      retries: 30

  data:
    <<: *app
    deploy:                          # the suite runs here: pytest plus the board's
      resources:                     # solver workers
        limits:
          memory: 2g
          pids: 256
    build: .
    command: ["data"]
    environment:
      <<: *env
      COUNTER_MATRIX_MCP_TOKEN: ${COUNTER_MATRIX_MCP_TOKEN:-}
    volumes:                         # every tool lands here: the pulls, the mirror, a tune,
      - ./.cache-blizzard:/app/.cache-blizzard             # a draft, the docs, the audit log
      - ./.cache-wiki:/app/.cache-wiki
      - ./.cache-counterpick:/app/.cache-counterpick
      - ./db/raw:/app/db/raw
      - ./db/data/authored:/app/db/data/authored
      - ./inference/strategies:/app/inference/strategies
      - ./docs:/app/docs
    ports:
      - "127.0.0.1:8020:8020"        # MCP over HTTP: /mcp, /health
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # healthy once the database is built and the MCP server answers
      test: ["CMD", "python", "-c",
             "import json,urllib.request;d=json.load(urllib.request.urlopen('http://localhost:8020/health'));assert d['status']=='ok' and d['heroes']>0 and not d['pending_migrations']"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 900s   # the first build scrapes the sources

  inference:
    <<: *app
    deploy:                          # the solver's worker pool: ~70 MB a worker, twelve at most
      resources:
        limits:
          memory: 2g
          pids: 256
    command: ["inference"]
    volumes: &reader_mounts       # the playbook, read-only; everything else comes from the database
      - ./inference/strategies:/app/inference/strategies:ro
    ports:
      - "127.0.0.1:8019:8019"
    depends_on:
      data:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import json,urllib.request;d=json.load(urllib.request.urlopen('http://localhost:8019/health'));assert d['status']=='ok'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  ui:
    <<: *app
    command: ["ui"]
    volumes: *reader_mounts
    ports:
      - "127.0.0.1:8017:8017"
    environment:
      <<: *env
      INFERENCE_URL: http://inference:8019
      COUNTER_MATRIX_UI_HOST: 0.0.0.0
      COUNTER_MATRIX_MCP_URL: http://data:8020/mcp     # the board's one write: tune
      COUNTER_MATRIX_MCP_TOKEN: ${COUNTER_MATRIX_MCP_TOKEN:-}
    depends_on:
      data:
        condition: service_healthy
      inference:
        condition: service_healthy

  refresher:
    <<: *app
    command: ["refresh"]
    volumes:                      # pulls into the caches, re-exports the mirror; reads the rest
      - ./.cache-blizzard:/app/.cache-blizzard
      - ./.cache-wiki:/app/.cache-wiki
      - ./.cache-counterpick:/app/.cache-counterpick
      - ./db/raw:/app/db/raw
      - ./db/data/authored:/app/db/data/authored:ro
      - ./inference/strategies:/app/inference/strategies:ro
    environment:
      <<: *env
      COUNTER_MATRIX_REFRESH_AT: ${COUNTER_MATRIX_REFRESH_AT:-05:00}
      COUNTER_MATRIX_REFRESH_MAX_AGE_HOURS: ${COUNTER_MATRIX_REFRESH_MAX_AGE_HOURS:-20}
      COUNTER_MATRIX_REFRESH_FULL_DAYS: ${COUNTER_MATRIX_REFRESH_FULL_DAYS:-7}
      TZ: ${TZ:-UTC}
    depends_on:
      data:
        condition: service_healthy

  sentry:
    <<: *app
    command: ["sentry"]
    volumes:                      # quarantines in the playbook, the report in raw; reads the inputs
      - ./db/raw:/app/db/raw
      - ./db/data/authored:/app/db/data/authored:ro
      - ./inference/strategies:/app/inference/strategies
    environment:
      <<: *env
      COUNTER_MATRIX_SENTRY_EVERY: ${COUNTER_MATRIX_SENTRY_EVERY:-30}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
