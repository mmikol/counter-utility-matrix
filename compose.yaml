# .venv/bin/python orchestrator.py  ->  one container per role, and a guard:
#
#   db          PostgreSQL
#   data        the door: builds the database from the bind-mounted page
#               caches when it is empty or stale, then serves every MCP tool
#               at http://localhost:8020/mcp (.mcp.json, server
#               "countrix-docker")
#   inference   INFERENCE ENGINE: http://localhost:8019, reading the strategy
#               files live
#   ui          the board at http://localhost:8017
#   refresher   the door's clock: seasons and rates daily at
#               COUNTRIX_REFRESH_AT (05:00 container time; set TZ), every
#               source weekly, and on start when the caches are 20 hours old
#   sentry      the guard: quarantines a strategy file that will not load or
#               reads like an instruction, flags instruction-like text in the
#               database, watches the MCP audit log; its report is what
#               `orchestrator.py status` prints
#
# Every container but db runs as an unprivileged user on a read-only root
# filesystem, with every capability dropped, no new privileges and process
# and memory limits. db takes no new privileges and keeps only the five
# capabilities its image needs to start as root and drop to postgres (below).
# All six share one network. Only data and refresher open a connection out,
# to two fixed hosts. Every published port binds to 127.0.0.1. No keys, no
# accounts.
# COUNTRIX_MCP_TOKEN (in .env) requires a bearer token on the MCP server.
# One image, built once by `data`, shared by every container; each container
# mounts only what it reads, read-only unless it writes there.

name: counter-utility-matrix

x-app: &app
  image: countrix
  # the checkout's owner on a Linux host, so the bind mounts stay writable
  user: "${COUNTRIX_UID:-1000}:${COUNTRIX_GID:-1000}"
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  deploy:
    resources:
      limits:
        memory: 1g
        pids: 256
  networks: [stack]
  environment: &env
    DATABASE_URL: postgresql://overwatch:${POSTGRES_PASSWORD:-overwatch}@db/overwatch
    # another playbook: a folder under the repo (empty: inference/strategies)
    COUNTRIX_STRATEGIES: ${COUNTRIX_STRATEGIES:-}

networks:
  stack: {}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: overwatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-overwatch}
      POSTGRES_DB: overwatch
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:                  # what the image needs to start as root and drop to postgres
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    networks: [stack]
    ports:
      - "127.0.0.1:5433:5432"        # host-side tools via ./docker-db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U overwatch -d overwatch"]
      interval: 2s
      timeout: 3s
      retries: 30

  data:
    <<: *app
    deploy:                          # the suite (orchestrator.py test) and the door's
      resources:                     # solves, a board's on the worker pool
        limits:
          memory: 2g
          pids: 256
    build: .
    command: ["data"]
    environment:
      <<: *env
      COUNTRIX_MCP_TOKEN: ${COUNTRIX_MCP_TOKEN:-}
    volumes:                         # every tool lands here: the pulls, the mirror, a tune,
      - ./.cache-blizzard:/app/.cache-blizzard             # a draft, the docs, the audit log
      - ./.cache-wiki:/app/.cache-wiki
      - ./db/raw:/app/db/raw
      - ./inference/strategies:/app/inference/strategies
      - ./docs:/app/docs
    ports:
      - "127.0.0.1:8020:8020"        # MCP over HTTP: /mcp, /health
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # healthy once the MCP server answers and the database's state is
      # current (db.psql.schema.state: built, migrated, filled)
      test: ["CMD", "python", "-c",
             "import json,urllib.request;d=json.load(urllib.request.urlopen('http://localhost:8020/health'));assert d.get('state')=='current'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 900s   # the first build scrapes the sources

  inference:
    <<: *app
    deploy:                          # the solver's worker pool: ~70 MB a worker, twelve at most
      resources:
        limits:
          memory: 2g
          pids: 256
    command: ["inference"]
    volumes: &reader_mounts       # the playbook, read-only; everything else comes from the database
      - ./inference/strategies:/app/inference/strategies:ro
    ports:
      - "127.0.0.1:8019:8019"
    depends_on:
      data:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import json,urllib.request;d=json.load(urllib.request.urlopen('http://localhost:8019/health'));assert d['status']=='ok'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  ui:
    <<: *app
    command: ["ui"]
    volumes: *reader_mounts
    ports:
      - "127.0.0.1:8017:8017"
    environment:
      <<: *env
      COUNTRIX_INFERENCE_URL: http://inference:8019
      COUNTRIX_UI_HOST: 0.0.0.0
      # the board writes nothing unless COUNTRIX_READ_ONLY=0; the two below
      # are the channel its writes would use (a tune, a record_match, through the door)
      COUNTRIX_READ_ONLY: ${COUNTRIX_READ_ONLY:-}
      COUNTRIX_MCP_URL: http://data:8020/mcp
      COUNTRIX_MCP_TOKEN: ${COUNTRIX_MCP_TOKEN:-}
    depends_on:
      data:
        condition: service_healthy
      inference:
        condition: service_healthy

  refresher:
    <<: *app
    command: ["refresh"]
    volumes:                      # pulls into the caches, re-exports the mirror; reads the playbook
      - ./.cache-blizzard:/app/.cache-blizzard
      - ./.cache-wiki:/app/.cache-wiki
      - ./db/raw:/app/db/raw
      - ./inference/strategies:/app/inference/strategies:ro
    environment:
      <<: *env
      COUNTRIX_REFRESH_AT: ${COUNTRIX_REFRESH_AT:-05:00}
      COUNTRIX_REFRESH_MAX_AGE_HOURS: ${COUNTRIX_REFRESH_MAX_AGE_HOURS:-20}
      COUNTRIX_REFRESH_FULL_DAYS: ${COUNTRIX_REFRESH_FULL_DAYS:-7}
      TZ: ${TZ:-UTC}
    depends_on:
      data:
        condition: service_healthy

  sentry:
    <<: *app
    command: ["sentry"]
    volumes:                      # quarantines in the playbook; the report in raw, beside the audit log
      - ./db/raw:/app/db/raw
      - ./inference/strategies:/app/inference/strategies
    environment:
      <<: *env
      COUNTRIX_SENTRY_EVERY: ${COUNTRIX_SENTRY_EVERY:-30}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
