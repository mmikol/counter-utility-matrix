# docker compose up --build  ->  one container per layer:
#
#   db          PostgreSQL (the database)
#   data        DATA LAYER: builds the database when empty or stale (rebuilds
#               from the bind-mounted page caches; recorded comps come back
#               from the db/raw mirror), then serves the MCP server over
#               HTTP at http://localhost:8020/mcp - the door a Claude Code
#               session opens (.mcp.json, server "overwatch-db-docker")
#   inference   INFERENCE ENGINE: http://localhost:8019 (infer, evaluate,
#               strategies, record) reading the strategies files live
#   ui          UI LAYER: the board at http://localhost:8017, reading the
#               database for facts and the inference service for comps
#   refresher   the data layer's clock: refreshes every source, the playbook
#               and the strategies mirror daily at OVERWATCH_DB_REFRESH_AT
#               (05:00 container time; set TZ for local time), and right away
#               on start when the cached pages are older than a day - so the
#               board is ready when a game starts
#
# No keys, no accounts. Every published port binds to 127.0.0.1: the board,
# the engine, the MCP endpoint and the database are reachable from this
# machine only. Host-side tools reach the database through ./docker-db
# (port 5433).
# One image, built once (by `data`), shared by every layer's container.
x-app: &app
  image: overwatch-db
  environment: &env
    DATABASE_URL: postgresql://overwatch:overwatch@db/overwatch
    PYTHONUNBUFFERED: "1"
  volumes: &mounts
    - ./.cache-blizzard:/app/.cache-blizzard
    - ./.cache-wiki:/app/.cache-wiki
    - ./.cache-counterpick:/app/.cache-counterpick
    - ./db/raw:/app/db/raw
    - ./db/data/authored:/app/db/data/authored
    - ./inference/strategies:/app/inference/strategies

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: overwatch
      POSTGRES_PASSWORD: overwatch
      POSTGRES_DB: overwatch
    ports:
      - "127.0.0.1:5433:5432"        # host-side tools via ./docker-db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U overwatch -d overwatch"]
      interval: 2s
      timeout: 3s
      retries: 30

  data:
    <<: *app
    build: .
    command: ["data"]
    ports:
      - "127.0.0.1:8020:8020"        # MCP over HTTP: /mcp, /health
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # healthy once the database is built and the MCP server answers
      test: ["CMD", "python", "-c",
             "import json,urllib.request;d=json.load(urllib.request.urlopen('http://localhost:8020/health'));assert d['status']=='ok' and d['heroes']>0 and not d['pending_migrations']"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 900s   # the first build scrapes the sources

  inference:
    <<: *app
    command: ["inference"]
    ports:
      - "127.0.0.1:8019:8019"
    depends_on:
      data:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import json,urllib.request;d=json.load(urllib.request.urlopen('http://localhost:8019/health'));assert d['status']=='ok'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  ui:
    <<: *app
    command: ["ui"]
    ports:
      - "127.0.0.1:8017:8017"
    environment:
      <<: *env
      INFERENCE_URL: http://inference:8019
      OVERWATCH_DB_UI_HOST: 0.0.0.0
    depends_on:
      data:
        condition: service_healthy
      inference:
        condition: service_healthy

  refresher:
    <<: *app
    command: ["refresh"]
    environment:
      <<: *env
      OVERWATCH_DB_REFRESH_AT: ${OVERWATCH_DB_REFRESH_AT:-05:00}
      OVERWATCH_DB_REFRESH_MAX_AGE_HOURS: ${OVERWATCH_DB_REFRESH_MAX_AGE_HOURS:-20}
      OVERWATCH_DB_REFRESH_FULL_DAYS: ${OVERWATCH_DB_REFRESH_FULL_DAYS:-7}
      TZ: ${TZ:-UTC}
    depends_on:
      data:
        condition: service_healthy

volumes:
  pgdata:
