# python orchestrator.py  ->  one container per layer, and a guard:
#
#   db          PostgreSQL (the database)
#   data        DATA LAYER: builds the database when it is empty or stale
#               (from the bind-mounted page caches), then serves the MCP server over HTTP
#               at http://localhost:8020/mcp - the door a Claude Code session
#               opens (.mcp.json, server "counter-utility-matrix-docker")
#   inference   INFERENCE ENGINE: http://localhost:8019, reading the strategy
#               files live
#   ui          UI LAYER: the board at http://localhost:8017
#   refresher   the data layer's clock: rates and counters daily at
#               COUNTER_MATRIX_REFRESH_AT (05:00 container time; set TZ), every
#               source weekly, and right away on start when the caches are a
#               day old
#   sentry      the guard: quarantines a strategy file that will not load or
#               reads like an instruction, flags instruction-like text in the
#               inputs and the database, watches the door's audit log; its
#               report is what `orchestrator.py status` prints
#
# Every container runs as an unprivileged user on a read-only root
# filesystem with every capability dropped and no new privileges, on one
# network (Docker publishes ports only on a routable one; what keeps a
# container off the internet is that its code opens no connection out).
# Every published port binds to 127.0.0.1. No keys, no accounts. Set
# COUNTER_MATRIX_MCP_TOKEN (in .env) to require a bearer token at the door.
# One image, built once (by `data`), shared by every container.

name: counter-utility-matrix

x-app: &app
  image: counter-utility-matrix
  user: "${COUNTER_MATRIX_UID:-1000}:${COUNTER_MATRIX_GID:-1000}"   # match the checkout's owner on Linux
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  deploy:
    resources:
      limits:
        memory: 1g
        pids: 256
  environment: &env
    DATABASE_URL: postgresql://overwatch:${POSTGRES_PASSWORD:-overwatch}@db/overwatch
    # another playbook for an experiment: a path under the repo, e.g.
    # inference/experiments/two-rules (see inference/experiments/README.md)
    COUNTER_MATRIX_STRATEGIES: ${COUNTER_MATRIX_STRATEGIES:-}
    PYTHONUNBUFFERED: "1"
    PYTHONDONTWRITEBYTECODE: "1"
  volumes: &mounts
    - ./.cache-blizzard:/app/.cache-blizzard
    - ./.cache-wiki:/app/.cache-wiki
    - ./.cache-counterpick:/app/.cache-counterpick
    - ./db/raw:/app/db/raw
    - ./db/data/authored:/app/db/data/authored
    - ./inference/strategies:/app/inference/strategies
    - ./docs:/app/docs

networks:
  stack: {}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: overwatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-overwatch}
      POSTGRES_DB: overwatch
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:                  # what the image needs to start as root and drop to postgres
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    networks: [stack]
    ports:
      - "127.0.0.1:5433:5432"        # host-side tools via ./docker-db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U overwatch -d overwatch"]
      interval: 2s
      timeout: 3s
      retries: 30

  data:
    <<: *app
    deploy:                          # the suite runs here: pytest plus the board's two
      resources:                     # solver workers, side by side, need the headroom
        limits:
          memory: 2g
          pids: 256
    build: .
    command: ["data"]
    networks: [stack]
    environment:
      <<: *env
      COUNTER_MATRIX_MCP_TOKEN: ${COUNTER_MATRIX_MCP_TOKEN:-}
    ports:
      - "127.0.0.1:8020:8020"        # MCP over HTTP: /mcp, /health
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # healthy once the database is built and the MCP server answers
      test: ["CMD", "python", "-c",
             "import json,urllib.request;d=json.load(urllib.request.urlopen('http://localhost:8020/health'));assert d['status']=='ok' and d['heroes']>0 and not d['pending_migrations']"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 900s   # the first build scrapes the sources

  inference:
    <<: *app
    command: ["inference"]
    networks: [stack]
    volumes: &reader_mounts       # reads the playbook and the caches; writes records only
      - ./.cache-blizzard:/app/.cache-blizzard:ro
      - ./.cache-wiki:/app/.cache-wiki:ro
      - ./.cache-counterpick:/app/.cache-counterpick:ro
      - ./db/raw:/app/db/raw
      - ./db/data/authored:/app/db/data/authored
      - ./inference/strategies:/app/inference/strategies:ro
      - ./docs:/app/docs:ro
    ports:
      - "127.0.0.1:8019:8019"
    depends_on:
      data:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import json,urllib.request;d=json.load(urllib.request.urlopen('http://localhost:8019/health'));assert d['status']=='ok'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  ui:
    <<: *app
    command: ["ui"]
    networks: [stack]
    volumes: *reader_mounts
    ports:
      - "127.0.0.1:8017:8017"
    environment:
      <<: *env
      INFERENCE_URL: http://inference:8019
      COUNTER_MATRIX_UI_HOST: 0.0.0.0
    depends_on:
      data:
        condition: service_healthy
      inference:
        condition: service_healthy

  refresher:
    <<: *app
    command: ["refresh"]
    networks: [stack]
    environment:
      <<: *env
      COUNTER_MATRIX_REFRESH_AT: ${COUNTER_MATRIX_REFRESH_AT:-05:00}
      COUNTER_MATRIX_REFRESH_MAX_AGE_HOURS: ${COUNTER_MATRIX_REFRESH_MAX_AGE_HOURS:-20}
      COUNTER_MATRIX_REFRESH_FULL_DAYS: ${COUNTER_MATRIX_REFRESH_FULL_DAYS:-7}
      TZ: ${TZ:-UTC}
    depends_on:
      data:
        condition: service_healthy

  sentry:
    <<: *app
    command: ["sentry"]
    networks: [stack]
    volumes:                      # quarantines in the playbook, reports in raw; reads the rest
      - ./.cache-blizzard:/app/.cache-blizzard:ro
      - ./.cache-wiki:/app/.cache-wiki:ro
      - ./.cache-counterpick:/app/.cache-counterpick:ro
      - ./db/raw:/app/db/raw
      - ./db/data/authored:/app/db/data/authored:ro
      - ./inference/strategies:/app/inference/strategies
      - ./docs:/app/docs:ro
    environment:
      <<: *env
      COUNTER_MATRIX_SENTRY_EVERY: ${COUNTER_MATRIX_SENTRY_EVERY:-30}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
