# Lint and test on every push and pull request.
#
# CI deliberately does NOT build the database: a rebuild scrapes Blizzard and
# the wiki, which is slow, flaky, and unkind to the sources on every push.
# The invariant tests skip themselves when db/psql/cluster is absent (see
# tests/conftest.py; COUNTER_MATRIX_NO_DATABASE=1 reproduces this locally), so
# CI lints with ruff and runs the pure tests (transforms, authored inputs,
# the expression language, the strategies catalog, tuning and deriving on a
# copy of the playbook, the refresh and orchestrator logic), the MCP protocol
# tests, which spawn the server without a database, and the documentation
# tests: every link resolves, every skill names real tools, and the
# generated sections of docs/ match what the code generates today. Coverage
# is reported without the bar; the runs with a database - the local one and
# the one inside the image (orchestrator.py test) - enforce the 75% that
# pyproject.toml sets.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: python -m ruff check db ui inference tests orchestrator.py

      - name: Tests (pure + protocol; db-bound tests skip without a built cluster)
        run: >-
          python -m pytest -q -rs -p no:cacheprovider
          --cov=db --cov=ui --cov=inference --cov=orchestrator
          --cov-report=term-missing:skip-covered --cov-fail-under=0
