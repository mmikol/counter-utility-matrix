# Lint and test on every push to main and every pull request.
#
# CI never builds the database: a build scrapes Blizzard and the wiki, slow and
# unkind to the sources on every push. Tests marked `invariant` skip themselves
# when db/psql/cluster is absent (tests/conftest.py; COUNTRIX_NO_DATABASE=1
# reproduces that locally), so what runs here is ruff, mypy and every test that
# needs no database, and CI holds that suite to 78% coverage. The runs with a
# database - the local one and `orchestrator.py test` inside the image -
# enforce the 75% pyproject.toml sets.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # without pgserver: CI builds no cluster, so the embedded Postgres would
      # be 33 MB downloaded and never started
      - name: Install dependencies
        run: grep -v '^pgserver' requirements.txt | pip install -r /dev/stdin

      - name: Lint (ruff)
        run: python -m ruff check db facts inference door ui tests scripts orchestrator.py

      - name: Types (mypy)
        run: python -m mypy db facts inference door ui orchestrator.py scripts

      - name: Tests (db-bound tests skip without a built cluster)
        run: >-
          python -m pytest -q -rs -p no:cacheprovider --cov --cov-fail-under=78
