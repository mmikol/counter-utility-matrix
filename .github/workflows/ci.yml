# Lint and test on every push and pull request.
#
# CI deliberately does NOT build the database: a rebuild scrapes Blizzard and
# the wiki, which is slow, flaky, and unkind to the sources on every push.
# The invariant tests skip themselves when db/psql/cluster is absent (see
# tests/conftest.py; COUNTER_MATRIX_NO_DATABASE=1 reproduces this locally), so
# CI runs the linter, the pure tests (transforms, authored inputs, the
# expression language, the strategies catalog, tuning and deriving on a copy
# of the playbook, the refresh and orchestrator logic), the MCP protocol
# tests, which spawn the server without a database, and the documentation
# tests: every link resolves, every skill names real tools, and the
# generated sections of docs/ match what the code generates today.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (pyflakes)
        run: python -m pyflakes db ui inference tests

      - name: Tests (pure + protocol; db-bound tests skip without a built cluster)
        run: python -m pytest -q -rs
