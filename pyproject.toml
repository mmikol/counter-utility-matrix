# Lint and coverage settings. pytest.ini holds the test paths and markers,
# requirements.txt the packages.

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["db/psql/cluster", "db/raw", ".cache-*"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, blind excepts, comprehensions,
# simplify, pyupgrade, naming, ruff's own checks, misc lints - the standard
# set, minus what the house style does on purpose: %-formatting
# (UP031/UP032), the ∪ and · in prose (RUF001-003), mutable class attributes
# as vocabulary (RUF012). A catch of every Exception is a boundary - a
# request, a daemon's pass - and says so: `# noqa: BLE001  # <why>`.
# Public functions carry full type annotations, and a record that crosses a
# module boundary is a dataclass or TypedDict rather than a bare dict or tuple.
select = ["E", "W", "F", "I", "B", "BLE", "C4", "SIM", "UP", "N", "RUF", "PIE"]
ignore = ["UP031", "UP032", "RUF001", "RUF002", "RUF003", "RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["db", "ui", "inference"]

# http.server dispatches a request to do_<METHOD>; ruff sees that only on a
# direct subclass of its handler, not on db.web.Handler's
[tool.ruff.lint.pep8-naming]
extend-ignore-names = ["do_*"]

[tool.coverage.run]
source = ["db", "ui", "inference", "orchestrator"]

[tool.coverage.report]
# the bar where the database exists (locally, and inside the image); CI builds
# no database and passes its own lower floor, in .github/workflows/ci.yml
fail_under = 75
show_missing = true
skip_covered = true
precision = 1
