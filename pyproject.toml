# Lint, type and coverage settings. pytest.ini holds the test paths and markers,
# requirements.txt the packages.

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["db/psql/cluster", "db/raw", ".cache-*"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, blind excepts, comprehensions,
# simplify, pyupgrade, naming, ruff's own checks, misc lints - the standard
# set, minus what the house style does on purpose: %-formatting
# (UP031/UP032), the ∪ and · in prose (RUF001-003), mutable class attributes
# as vocabulary (RUF012). A catch of every Exception is a boundary - a
# request, a daemon's pass - and says so: `# noqa: BLE001  # <why>`. An
# import sits in the module's import block (PLC0415); one deferred into a
# function is deliberate and says so: `# noqa: PLC0415  # <why>`.
# Every function carries full type annotations (mypy holds it, below), and a
# record that crosses a module boundary is a dataclass, NamedTuple or
# TypedDict, not a bare dict or tuple.
select = ["E", "W", "F", "I", "B", "BLE", "C4", "SIM", "UP", "N", "RUF", "PIE", "PLC0415"]
ignore = ["UP031", "UP032", "RUF001", "RUF002", "RUF003", "RUF012"]

# the import rule covers the code the app runs; a test may import a module
# inside the test that uses it
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLC0415"]

[tool.ruff.lint.isort]
known-first-party = ["db", "facts", "inference", "door", "ui"]

# http.server dispatches a request to do_<METHOD>; ruff sees that only on a
# direct subclass of its handler, not on db.web.Handler's
[tool.ruff.lint.pep8-naming]
extend-ignore-names = ["do_*"]

# The types: `python -m mypy db facts inference door ui orchestrator.py
# scripts`, as CI runs it; the tests are not checked. Every function and
# method is annotated. psycopg, requests and beautifulsoup4 ship their own
# types (py.typed), so no stub package is installed; a missing import is
# ignored by name, never wholesale.
[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_ignores = true

# pgserver ships types too, but the image and CI filter it out of
# requirements.txt: there it is missing
[[tool.mypy.overrides]]
module = ["pgserver", "pgserver.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["db", "facts", "inference", "door", "ui", "orchestrator"]

[tool.coverage.report]
# the bar where the database exists (locally, and inside the image); CI builds
# no database and holds the database-free suite to 78%, above this bar
# (.github/workflows/ci.yml)
fail_under = 75
show_missing = true
skip_covered = true
precision = 1
